spring.application.name=MultiModel
server.port=8080
server.address=127.0.0.1
server.error.include-message=always

# Embedded, encrypted local database (stored in the user's home folder, no MySQL needed)
spring.datasource.url=jdbc:h2:file:${user.home}/.multimodel/multimodel;CIPHER=AES
spring.datasource.username=multimodel
spring.datasource.password=${DB_FILE_PASSWORD:change-me-file} ${DB_USER_PASSWORD:change-me-user}
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local LLM (Ollama) for PDF field extraction
ollama.url=http://localhost:11434
ollama.model=qwen2.5:7b-instruct
logging.level.org.springframework.security=DEBUG